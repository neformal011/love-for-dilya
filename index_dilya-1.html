<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Дили ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
overflow:hidden;
height:100vh;
font-family:Arial,sans-serif;
color:#fff;
}
#stars,#hearts,#petals,#particles{
position:fixed;inset:0;pointer-events:none;
}
.center{
position:absolute;inset:0;display:flex;
justify-content:center;align-items:center;flex-direction:column;
}
.hint{font-size:24px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.4}}

.envelope{
position:relative;width:320px;height:220px;cursor:pointer;
transition:1s;
}
.base{
position:absolute;inset:0;background:#fff;border-radius:8px;
}
.flap{
position:absolute;left:0;top:0;width:0;height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:120px solid #ddd;
transform-origin:top;
transition:1s;
z-index:3;
}
.letter{
position:absolute;left:15px;right:15px;bottom:10px;height:180px;
background:#fff;color:#000;border-radius:8px;
display:flex;align-items:center;justify-content:center;
font-size:26px;font-weight:bold;
transform:translateY(80px);
transition:1s;
}
.open .flap{transform:rotateX(180deg)}
.open .letter{transform:translateY(-140px)}

.message{
position:fixed;inset:0;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
opacity:0;transition:2s;
background:
radial-gradient(circle at center, rgba(255,0,120,.15), transparent 40%),
#000;
}
.message.show{opacity:1}

.bigheart{
font-size:120px;
animation:pulse 1.6s infinite;
filter:drop-shadow(0 0 20px #fff);
}
@keyframes pulse{
50%{transform:scale(1.15)}
}

.name{
font-size:72px;
font-weight:bold;
margin:10px 0;
text-shadow:0 0 20px #fff;
}
.text{
font-size:30px;
text-align:center;
max-width:800px;
line-height:1.6;
padding:0 20px;
text-shadow:0 0 10px #fff;
min-height:160px;
}
.footer{
margin-top:25px;
font-size:20px;
opacity:.9;
}

.star,.heart,.petal,.particle{
position:absolute;
}

.sideglow{
position:fixed;top:0;height:100%;width:250px;
filter:blur(80px);
animation:move 4s infinite alternate;
}
.left{left:-100px;background:rgba(255,0,120,.25)}
.right{right:-100px;background:rgba(255,0,200,.25)}
@keyframes move{
from{transform:translateY(-20px)}
to{transform:translateY(20px)}
}
</style>
</head>
<body>

<div class="sideglow left"></div>
<div class="sideglow right"></div>

<div id="stars"></div>
<div id="hearts"></div>
<div id="petals"></div>
<div id="particles"></div>

<div class="center" id="intro">
<div class="hint">Нажми на письмо ❤️</div><br>
<div class="envelope" id="env">
<div class="base"></div>
<div class="flap"></div>
<div class="letter">💌 Для Дили</div>
</div>
</div>

<div class="message" id="msg">
<div class="bigheart">❤️</div>
<div class="name">Диля</div>
<div class="text" id="typed"></div>
<div class="footer">Навсегда в моём сердце ✨</div>
</div>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<120;i++){
 let s=document.createElement('div');
 s.className='star';
 s.style.left=Math.random()*100+'vw';
 s.style.top=Math.random()*100+'vh';
 s.style.width='2px'; s.style.height='2px';
 s.style.background='white';
 s.style.opacity=Math.random();
 stars.appendChild(s);
}

function spawnHeart(){
 let h=document.createElement('div');
 h.className='heart';
 h.innerHTML='❤️';
 h.style.left=Math.random()*100+'vw';
 h.style.bottom='-30px';
 h.style.fontSize=(15+Math.random()*35)+'px';
 h.style.transition='8s linear';
 document.getElementById('hearts').appendChild(h);
 setTimeout(()=>{
   h.style.transform='translateY(-120vh)';
   h.style.opacity='0';
 },50);
 setTimeout(()=>h.remove(),8000);
}

function spawnPetal(){
 let p=document.createElement('div');
 p.className='petal';
 p.innerHTML='🌹';
 p.style.left=Math.random()*100+'vw';
 p.style.top='-40px';
 p.style.fontSize=(18+Math.random()*18)+'px';
 p.style.transition='10s linear';
 document.getElementById('petals').appendChild(p);
 setTimeout(()=>{
   p.style.transform='translateY(120vh) rotate(360deg)';
   p.style.opacity='0';
 },50);
 setTimeout(()=>p.remove(),10000);
}

function spawnParticle(){
 let p=document.createElement('div');
 p.className='particle';
 p.innerHTML='✨';
 p.style.left=Math.random()*100+'vw';
 p.style.top=Math.random()*100+'vh';
 document.getElementById('particles').appendChild(p);
 setTimeout(()=>p.remove(),2000);
}

const text=`Люблю тебя очень сильно ❤️

Хочу, чтобы мы всегда были вместе 😝❤️

Ты делаешь мои дни лучше и ярче.`;

function typeText(){
 let i=0;
 const el=document.getElementById('typed');
 const timer=setInterval(()=>{
   el.textContent+=text[i];
   i++;
   if(i>=text.length) clearInterval(timer);
 },55);
}

document.getElementById('env').onclick=()=>{
 document.getElementById('env').classList.add('open');

 setTimeout(()=>{
   document.getElementById('intro').style.display='none';
   document.getElementById('msg').classList.add('show');
   typeText();

   setInterval(spawnHeart,120);
   setInterval(spawnPetal,900);
   setInterval(spawnParticle,300);

 },1200);
};
</script>
</body>
</html>

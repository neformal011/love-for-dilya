<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Дили ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(2px 2px at 80% 20%, white, transparent),
radial-gradient(2px 2px at 60% 70%, white, transparent),
radial-gradient(3px 3px at 40% 80%, white, transparent),
radial-gradient(2px 2px at 90% 60%, white, transparent);
animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
from{opacity:.4}
to{opacity:1}
}

.wrapper{
position:relative;
z-index:10;
text-align:center;
}

.hint{
margin-bottom:25px;
font-size:22px;
letter-spacing:2px;
animation:pulseText 1.5s infinite;
}

@keyframes pulseText{
50%{opacity:.5}
}

.envelope{
position:relative;
width:300px;
height:200px;
margin:auto;
cursor:pointer;
transition:0.5s;
}

.base{
position:absolute;
width:100%;
height:100%;
background:#ffffff;
border-radius:8px;
}

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-top:110px solid #e5e5e5;
transform-origin:top;
transition:1s;
z-index:3;
}

.letter{
position:absolute;
left:15px;
right:15px;
bottom:10px;
height:170px;
background:white;
color:black;
padding:20px;
border-radius:8px;
transition:1s;
z-index:2;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:22px;
font-weight:bold;
transform:translateY(80px);
}

.open .flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(-140px);
}

.message{
opacity:0;
transition:2s;
position:absolute;
top:55%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:800px;
pointer-events:none;
}

.show{
opacity:1;
}

.name{
font-size:70px;
font-weight:bold;
text-shadow:
0 0 10px white,
0 0 20px white,
0 0 40px white;
margin-bottom:20px;
}

.text{
font-size:30px;
line-height:1.6;
text-shadow:
0 0 10px white,
0 0 20px white;
}

.heart{
position:absolute;
bottom:-30px;
animation:fly linear forwards;
}

@keyframes fly{
0%{
transform:translateY(0) scale(.5);
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.8);
opacity:0;
}
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="wrapper">

<div class="hint" id="hint">
Нажми на письмо ❤️
</div>

<div class="envelope" id="envelope">

<div class="base"></div>

<div class="flap"></div>

<div class="letter">
💌 Для Дили
</div>

</div>

</div>

<div class="message" id="message">

<div style="font-size:100px;">❤️</div>

<div class="name">
Диля
</div>

<div class="text">
Люблю тебя очень сильно ❤️<br><br>
И хочу, чтобы мы всегда были вместе 😝❤️
</div>

</div>

<script>

const envelope=document.getElementById("envelope");
const message=document.getElementById("message");
const hint=document.getElementById("hint");

envelope.addEventListener("click",()=>{

envelope.classList.add("open");

setTimeout(()=>{
message.classList.add("show");
hint.style.display="none";
},1000);

startHearts();

});

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*45)+"px";
heart.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

function startHearts(){

setInterval(createHeart,120);

}

</script>

</body>
</html>
